<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#FBF6EE">  <title>Puppy Playtime</title>
  <link rel="icon" href="paw.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="home">

  <!-- Home: preview the three rounds, tweak names and settings, start -->
  <section id="home" class="screen">
    <header class="hero">
      <span class="logo-wrap"><img class="logo" src="paw.svg" alt=""></span>
      <h1>Puppy Playtime
        <svg class="squiggle" viewBox="0 0 120 10" aria-hidden="true"><path d="M3 6 Q 13 1 23 6 T 43 6 T 63 6 T 83 6 T 103 6 T 117 5" fill="none" stroke="#E9B949" stroke-width="3.5" stroke-linecap="round"/></svg>
      </h1>
      <p class="sub">3 sets per round: 30s, 45s, then 60s per exercise</p>
    </header>

    <div id="rounds"></div>

    <section class="card settings">
      <div class="row">
        <span>Get-ready time</span>
        <div class="seg" id="readySeg">
          <button data-v="3">3s</button><button data-v="5">5s</button><button data-v="10">10s</button>
        </div>
      </div>
      <div class="row">
        <span>Sounds</span>
        <button id="soundBtn" class="toggle"></button>
      </div>
    </section>

    <div class="start-wrap">
      <button id="startBtn" class="big">Let's play! 🐾</button>
      <p id="estimate" class="muted"></p>
    </div>
  </section>

  <!-- Workout -->
  <section id="play" class="screen hidden">
    <div class="topbar">
      <div class="rounds-ind"><span id="roundDots"></span><span id="roundLabel"></span></div>
      <button id="endBtn" class="icon" aria-label="End workout">✕</button>
    </div>
    <div id="chip" class="chip"></div>
    <div class="pie-wrap" id="pieWrap">
      <div id="pie"></div>
      <div class="center">
        <div id="phase" class="phase"></div>
        <div id="count" class="count"></div>
        <div id="exName" class="ex"></div>
      </div>
    </div>
    <div id="upnext" class="upnext"></div>
    <div id="controls" class="controls"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="confetti"></div>

  <script src="app.js"></script>
</body>
</html>
