name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/puppy.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/puppy.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret; the APK will be signed with a throwaway debug key."
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PuppyPlaytime.apk
          gh release create "v1.0.${{ github.run_number }}" PuppyPlaytime.apk \
            --title "Puppy Playtime 1.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. On your phone, download PuppyPlaytime.apk and tap it to install." \
            --latest
